# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: foundry-identity-flows
requiredVersions:
  azd: ">=1.36.0"
infra:
  provider: bicep
  path: infra
services:
  api:
    project: .
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: false
      buildArgs:
        - --secret
        - id=pip_config,src=${PIP_CONFIG_FILE}
