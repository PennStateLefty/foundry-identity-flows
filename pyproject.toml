[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-identity-flows"
version = "0.1.0"
description = "Reproducible Microsoft Foundry identity propagation experiments"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.25,<2",
  "httpx>=0.28,<1",
  "msal>=1.34,<2",
  "PyJWT[crypto]>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "mcp>=1.30,<2",
]

[project.optional-dependencies]
hosted = ["azure-ai-agentserver-responses>=2.4.0b1,<3"]

[project.scripts]
identity-lab = "identity_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
