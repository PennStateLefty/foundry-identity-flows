# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: foundry-identity-flows
requiredVersions:
  azd: ">=1.36.0"
infra:
  provider: bicep
  path: infra
services:
  api:
    language: docker
    host: containerapp
    image: ${LAB_API_IMAGE}
    docker:
      imagePassthrough: true
      remoteBuild: false
